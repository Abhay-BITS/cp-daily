:"TLE",explanation:"Sort itself is fine (~2 × 10⁷ ops), but std::endl flushes buffer N = 10⁵ times. Use '\\n' instead. endl causes ~100x slowdown on large output."},{id:8,constraints:"N = 20, Time Limit: 2.0s",approach:"Bitmask DP over subsets: O(2ᴺ · N)",answer:"AC",explanation:"2²⁰ · 20 ≈ 2 × 10⁷ ops. Classic TSP/assignment DP. Well within limits for N ≤ 20."},{id:9,constraints:"T = 10⁵ test cases, N = 10⁵ per case, Time Limit: 3.0s",approach:"memset(dp, 0, sizeof(dp)) inside each test case with dp[100001]: O(T · N)",answer:"TLE",explanation:"~10¹⁰ ops just from memset. Reset only the used portion of the array, or use a generation counter to avoid clearing."},{id:10,constraints:"N = 10⁵, M = 10⁵ edges, Time Limit: 1.5s",approach:"Dijkstra with std::priority_queue: O((N + M) log N)",answer:"AC",explanation:"~3 × 10⁶ ops. Standard Dijkstra with binary heap is efficient for sparse graphs. Well within 1.5s."}],zr=[{id:1,title:"Maximum Subarray Sum",constraint:"N ≤ 10⁵, a[i] ≤ 10⁹",code:[{line:1,text:"#include <bits/stdc++.h>",buggy:!1},{line:2,text:"using namespace std;",buggy:!1},{line:3,text:"int main() {",buggy:!1},{line:4,text:"    int n; cin >> n;",buggy:!1},{line:5,text:"    vector<int> a(n);",buggy:!1},{line:6,text:"    for(int i = 0; i < n; i++) cin >> a[i];",buggy:!1},{line:7,text:"    int current_sum = 0, max_sum = 0;",buggy:!0},{line:8,text:"    for(int i = 0; i < n; i++) {",buggy:!1},{line:9,text:"        current_sum += a[i];",buggy:!1},{line:10,text:"        max_sum = max(max_sum, current_sum);",buggy:!1},{line:11,text:"        if(current_sum < 0) current_sum = 0;",buggy:!1},{line:12,text:"    }",buggy:!1},{line:13,text:"    cout << max_sum << endl;",buggy:!1},{line:14,text:"}",buggy:!1}],bugLine:7,explanation:"Line 7: 'int current_sum' overflows 32-bit integer when N = 10⁵ and a[i] = 10⁹. Sum can reach 10¹⁴, exceeding INT_MAX (2.1 × 10⁹). Use 'long long' instead."},{id:2,title:"Binary Search: Lower Bound",constraint:"N ≤ 10⁶, sorted array, find first ele
